[project]
name = "materials-event-modeling"
version = "0.1.0"
description = "Pre-taxonomic representation learning for material-making events."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11",
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.2",
  "tqdm>=4.66",
  "umap-learn>=0.5.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
