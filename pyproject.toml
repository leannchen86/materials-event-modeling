[project]
name = "materials-event-modeling"
version = "0.1.0"
description = "Compression-aware, provenance-stressed evaluation of materials experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11",
  "jsonschema>=4.23",
  "numpy>=1.26",
  "pandas>=2.2",
  "referencing>=0.35",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "ty>=0.0.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Keep checks focused on correctness, imports, and modernization; formatting is separate.
[tool.ruff.lint]
select = [
  "F",     # pyflakes: undefined names, unused imports/vars — always semantic
  "E4", "E7", "E9",  # real errors (imports, statements, syntax); NOT E501
  "I",     # import sorting (auto-fixed; keeps diffs clean)
  "B",     # bugbear: loop-var closures (B023), zip-without-strict (B905), etc.
  "UP",    # pyupgrade modernization (auto-fixed)
  "C4",    # comprehension correctness/clarity
  "RUF",   # ruff-native semantic checks
]
ignore = [
  "E741",    # ambiguous name (l/I/O) — we use w,l for winner/loser deliberately
  "RUF001", "RUF002", "RUF003",  # unicode-in-string/docstring (× in specs, µm units)
  "RUF046",  # "cast to int already int" — false positive on int(np.int64) needed for JSON
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]  # scripts may set up sys.path before imports

# Type-check reusable library code and tests; scripts remain ruff-covered.
[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]
