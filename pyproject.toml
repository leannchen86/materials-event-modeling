[project]
name = "materials-event-modeling"
version = "0.1.0"
description = "Pre-taxonomic representation learning for material-making events."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11",
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "ty>=0.0.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Curated to catch semantic bugs, not enforce style. Line-length is the formatter's
# job (E501 is off); complexity/magic-value rules (PLR*) are engineering theater for
# research code. What stays are real bug classes and import/modernization hygiene.
[tool.ruff.lint]
select = [
  "F",     # pyflakes: undefined names, unused imports/vars — always semantic
  "E4", "E7", "E9",  # real errors (imports, statements, syntax); NOT E501
  "I",     # import sorting (auto-fixed; keeps diffs clean)
  "B",     # bugbear: loop-var closures (B023), zip-without-strict (B905), etc.
  "UP",    # pyupgrade modernization (auto-fixed)
  "C4",    # comprehension correctness/clarity
  "RUF",   # ruff-native semantic checks
]
ignore = [
  "E741",    # ambiguous name (l/I/O) — we use w,l for winner/loser deliberately
  "RUF001", "RUF002", "RUF003",  # unicode-in-string/docstring (× in specs, µm units)
  "RUF046",  # "cast to int already int" — false positive on int(np.int64) needed for JSON
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]  # scripts may set up sys.path before imports
# Archived event-method oleogel scripts: helpers close over a loop var but are called
# same-iteration (safe); documented rather than churned in a closed reference archive.
"scripts/run_oleogel_*.py" = ["B023"]

# Type checking is gated on the reusable library (src) + its tests, where types earn
# their keep. scripts/ are run-once entrypoints with heavy pandas/argparse dynamism
# (~73 diagnostics that are noise, not bugs) — ruff still covers them for real bug
# classes. Tighten `src` toward stricter rules as the typed-Event refactor lands.
[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]
# oleogel_masked is archived campaign code importing torch, which is an OPTIONAL extra
# ([train]) not installed in CI — excluded from the type gate, still ruff-covered.
exclude = ["src/materials_event_modeling/track_b/oleogel_masked.py"]
